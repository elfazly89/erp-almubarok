services:
  postgres:
    image: postgres:16-alpine
    container_name: erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-erp_almubarok}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almubarok_secret_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./erp_almubarok_dump.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Port 5432 tidak diekspos ke host agar tidak bentrok dengan PostgreSQL native/SIAKAD
    # Port ini tetap bisa diakses oleh service 'api' melalui internal Docker network
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_almubarok"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  api:
    build:
      context: ./erp-almubarok-api
      dockerfile: Dockerfile
    container_name: erp-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-almubarok_secret_2026}@postgres:5432/${POSTGRES_DB:-erp_almubarok}
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_erp_al_mubarok_2026_abdi_priyayi}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3101:3001"
    mem_limit: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-web
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET:-super_secret_key_erp_al_mubarok_2026_abdi_priyayi}
      PORT: 3000
    depends_on:
      - api
    ports:
      # Port 3000 diubah ke 3100 agar tidak bentrok dengan PM2 (port 3000) di VPS
      - "127.0.0.1:3100:3000"
    mem_limit: 1024m
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  pgdata:
